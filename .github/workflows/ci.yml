name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cellfie
      - uses: actions/checkout@v4
        with:
          repository: protegeproject/mapping-master
          ref: 9cb898c2e9d574a95dce788b4edf1105cf094279
          path: mapping-master
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build and test MappingMaster
        working-directory: mapping-master
        run: mvn --batch-mode clean install
      - name: Build and test Cellfie
        working-directory: cellfie
        run: mvn --batch-mode clean verify
